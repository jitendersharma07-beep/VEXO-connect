server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Resolving through a variable defers the lookup to
    # request time; a literal upstream would pin the backend IP at startup and
    # keep proxying to a dead address after the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API keeps the pos_session cookie first-party. The trailing
    # slash is load-bearing: a bare `location /api` would also swallow SPA
    # paths that merely start with "api".
    location ^~ /api/ {
        set $api_upstream http://backend:5000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed asset filenames are immutable, but index.html must never be cached
    # or a browser keeps loading bundles a redeploy has already removed.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: direct links and refreshes on nested routes serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
