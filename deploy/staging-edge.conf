# Canonical nginx config for the loopback staging edge (container
# vcx-staging-edge, nginx:alpine, --network host). Bind-mounted read-only at
# /etc/nginx/conf.d/default.conf, with frontend/dist mounted read-only at
# /usr/share/nginx/html.
#
# Two invariants here are paired with the frontend build, and both are checked
# by deploy/staging-assert.sh:
#
#   1. The SPA is served at the ROOT of this origin — `location /assets/`, no
#      /pos/ prefix anywhere. So the bundle must be built with VITE_BASE_PATH=/
#      (see deploy/staging-local.env.sh). A /pos/-based bundle does not get its
#      JavaScript from this config; it gets the SPA fallback below, which is a
#      200 of text/html, and the page stays blank.
#
#   2. `location ^~ /api/` proxies to the API. The `^~` is load-bearing: it
#      stops the SPA fallback from answering an API path with index.html, which
#      would turn an unproxied API into a 200 of HTML rather than a visible
#      error.
#
# Whatever origin this is reached on must also appear in the backend's
# CORS_ORIGIN allow-list, because the browser puts that origin on its login
# POST even though it is same-origin.

server {
    # Loopback only. This edge runs with --network host so it can reach the
    # staging backend on 127.0.0.1:5540 without the backend binding a public
    # interface; binding the listener to 127.0.0.1 keeps it off the public IP.
    listen 127.0.0.1:8120;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5540$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
