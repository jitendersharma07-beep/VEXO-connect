# Distinct project name so this file can never collide with the development
# stack: compose derives container names, image tags and volume names from it.
name: pos-prod

# Docker's json-file driver keeps EVERY line forever unless told otherwise, and
# the daemon has no host-wide default here (no /etc/docker/daemon.json). One
# container's log therefore grows without limit on the same 98 GB volume that
# holds /var/lib/docker and the Postgres data directory — and this box was at
# 83% before this block existed. A full disk does not degrade the POS, it
# crash-loops Postgres and zeroes files mid-write.
#
# An anchor rather than three copies: a service that silently MISSES the block
# is exactly the failure this is meant to prevent, and a missing `logging:` key
# looks identical to a present one until the disk fills.
#
# 10m x 5 is a hard 50 MB ceiling per container, 150 MB for the stack — bounded
# and predictable, which matters more than retention depth. At the backend's
# observed ~10 MB/day that is roughly five days of history; the durable record
# of what happened is the audit table and the nightly dump, not stdout.
#
# Deliberately scoped to this compose project instead of /etc/docker/daemon.json:
# a daemon default would silently re-log every other stack on this host and
# needs a daemon restart to apply.
x-logging: &pos-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Build provenance, stamped into both images as OCI labels (and, for the backend,
# env vars the process reports over /api/version). Compose cannot shell out to
# `git rev-parse`, so the deploy must export these before `up --build` — the §3
# block in docs/DEPLOY-PHASE2.md is the authoritative form.
#
# An anchor for the same reason `x-logging` is one: a service that silently
# MISSES the block is the failure this is meant to prevent. A half-stamped stack,
# where the backend knows its commit and the frontend does not, is worse than no
# stamping at all, because the one answer you get looks authoritative.
#
# The default is the literal string "unknown", never empty. An image whose
# revision reads "unknown" is visibly un-stamped; a blank one is indistinguishable
# from an image built before this block existed.
x-build-provenance: &pos-build-provenance
  GIT_SHA: ${GIT_SHA:-unknown}
  BUILD_TIME: ${BUILD_TIME:-unknown}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *pos-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Deliberately no "ports": the database is reachable only from the compose
    # network.
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: *pos-build-provenance
    restart: unless-stopped
    logging: *pos-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 5000
    # No published port and no source bind mounts: the container nginx is the
    # only way in, and the image is the single source of truth.
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/index.js"
    # Answers "is it actually serving?", which `docker ps` alone cannot: a
    # node process that has stopped accepting requests still reports Up.
    #
    # It probes through the app's own route, so it exercises the same stack a
    # cashier does. It deliberately does NOT touch the database — postgres has
    # its own healthcheck, and a check that fails for two different reasons
    # cannot tell you which one happened.
    #
    # `node -e` rather than curl or wget: node:20-bookworm-slim ships neither
    # (verified in the running container, not assumed), and a healthcheck
    # calling a binary the image lacks reports unhealthy forever — a fault
    # that looks exactly like the fault it was added to detect.
    #
    # start_period covers `prisma migrate deploy`, which runs before the
    # listener exists; without it the container reports unhealthy on every
    # boot until the migration finishes.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const r = require('http').get('http://127.0.0.1:5000/api/health', { timeout: 4000 }, (s) => process.exit(s.statusCode === 200 ? 0 : 1));
          r.on('error', () => process.exit(1));
          r.on('timeout', () => { r.destroy(); process.exit(1); });
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        <<: *pos-build-provenance
        # Vite inlines this into the bundle; moving POS from the /pos path
        # mount to a dedicated domain is a .env change + rebuild, not a code
        # edit. Default is the root-domain case.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    logging: *pos-logging
    ports:
      # Loopback only: the host nginx is the sole way in.
      - "127.0.0.1:${HTTP_PORT:-8110}:80"
    depends_on:
      # Start order only, deliberately NOT service_healthy. If the backend is
      # broken, a served UI saying it cannot reach the server is far easier to
      # diagnose than a refused connection on 8110 — which looks identical to
      # the whole host being down.
      - backend
    # nginx:1.27-alpine has wget (busybox) and no node, so this one is the
    # mirror image of the backend's. Checked in the running container.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pos_pgdata:
