# Development stack: Postgres only. The backend (node --watch, port 5010) and
# frontend (vite, port 5177) run on the host during development.
name: pos-dev

services:
  db:
    image: postgres:16-alpine
    container_name: atc-pos-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atc_pos
      # Value lives in the git-ignored .env, never in this file. It must match
      # what is already in the pos_dev_pgdata volume: POSTGRES_PASSWORD is only
      # read at initdb, so editing it here cannot rotate the role.
      POSTGRES_PASSWORD: ${POS_DEV_DB_PASSWORD:?unset - copy .env.example to .env and fill it}
      POSTGRES_DB: atc_pos
    ports:
      # Loopback only; 5439 avoids every Postgres already on this box.
      - "127.0.0.1:5439:5432"
    volumes:
      - pos_dev_pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  pos_dev_pgdata:
